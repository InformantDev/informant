name = "test"
command = """
set -eu
bun test
"""
timeout_minutes = 15
container = { image = "oven/bun:1", cpu = 2, memory_mb = 4096, prepareInputs = ["bun.lock", "bunfig.toml", "package.json", "apps/*/package.json"], prepare = """
set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get update
apt-get install -y --no-install-recommends git inn2
ln -sf /usr/lib/news/bin/shlock /usr/local/bin/shlock
rm -rf /var/lib/apt/lists/*
bun install --frozen-lockfile --ignore-scripts
""" }
