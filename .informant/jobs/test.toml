name = "test"
command = """
set -eu
bun install --frozen-lockfile --backend=copyfile
bun test
"""
timeout_minutes = 15
environment = { CI = "true" }
container.image = "oven/bun:1"
container.cpu = 2
container.memory_mb = 4096
container.prepareInputs = ["bun.lock", "bunfig.toml", "package.json", "apps/*/package.json"]
container.prepare = """
set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get update
apt-get install -y --no-install-recommends git inn2
ln -sf /usr/lib/news/bin/shlock /usr/local/bin/shlock
rm -rf /var/lib/apt/lists/*
bun install --frozen-lockfile --ignore-scripts
"""
