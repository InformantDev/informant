name = "Staff Review"
# Workers advertise this label only after allowing the pi-auth mount.
runs_on = ["container", "staff-review"]
optional = true
command = """
set -eu
review_root="$PWD"
review_home="$(mktemp -d)"
pr_number="${INFORMANT_BRANCH#pull/}"
if [ "$pr_number" = "$INFORMANT_BRANCH" ]; then
  echo "staff review can only run for a pull request" >&2
  exit 1
fi
github_token="$GITHUB_TOKEN"
export GH_TOKEN="$github_token"
pr_json="$(curl -fsSL \
  -H "Accept: application/vnd.github+json" \
  -H "Authorization: Bearer $github_token" \
  -H "X-GitHub-Api-Version: 2022-11-28" \
  "https://api.github.com/repos/$INFORMANT_REPOSITORY/pulls/$pr_number")"
head_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha')"
base_sha="$(printf '%s' "$pr_json" | jq -r '.base.sha')"
if [ "$head_sha" != "$INFORMANT_SHA" ]; then
  echo "pull request head changed before staff review" >&2
  exit 1
fi

staff diff --base "$base_sha" --head working-tree --json >/dev/null
slug="$base_sha..WT"

unset GITHUB_TOKEN
unset GH_TOKEN
export HOME="$review_home"
export XDG_CONFIG_HOME="$review_home/.config"
export INFORMANT_REVIEW_ROOT="$review_root"
cd "$review_root"
pi --print \
  --no-session \
  --approve \
  --no-extensions \
  --extension /opt/informant/staff-review-pi.ts \
  --extension /root/.bun/install/global/node_modules/pi-subagents/index.ts \
  --no-prompt-templates \
  --no-context-files \
  --tools read,bash,grep,find,ls,staff_agent \
  --append-system-prompt 'Use staff_agent whenever the Staff Review skill asks for a find or verify sub-agent. Make one tool call per agent, issue independent calls together for parallel execution, pass the complete worker prompt as task, and set role=find or role=verify. The trusted adapter delegates through pi-subagents, waits for completion, and returns validated JSON; do not launch Pi through bash or call subagent management commands.' \
  "/skill:staff-review $slug"

export GH_TOKEN="$github_token"
staff review post
"""
triggers = [{ event = "commit", pull_request = { state = "open", draft = false } }]
secrets = ["GITHUB_TOKEN"]
environment = { PI_CODING_AGENT_DIR = "/mnt/informant-pi", PI_OFFLINE = "1", PI_SUBAGENT_EXTRA_AGENT_DIRS = "/opt/informant/staff-review-agents", PI_SUBAGENT_CAPABILITY_CEILING_V1 = "eyJ2ZXJzaW9uIjoxLCJhbGxvd2VkVG9vbHMiOlsiYmFzaCIsImZpbmQiLCJncmVwIiwibHMiLCJyZWFkIl0sImFsbG93ZWRBZ2VudHMiOlsic3RhZmYtcmV2aWV3LWZpbmQiLCJzdGFmZi1yZXZpZXctdmVyaWZ5Il0sImRlbnlFeHRlbnNpb25zIjpmYWxzZSwic291cmNlcyI6WyJJbmZvcm1hbnQgU3RhZmYgUmV2aWV3Il19" }
mounts = [{ source = "pi-auth", target = "/mnt/informant-pi", write_back = true }]
cache = [{ paths = ["~/.bun/install/cache"], shared = true }]
container = { image = "docker.io/oven/bun:1", cpu = 2, memory_mb = 4096, nestedNamespaces = true, prepare = """
set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get update
apt-get install -y --no-install-recommends bubblewrap ca-certificates curl git jq ripgrep
rm -rf /var/lib/apt/lists/*
export HOME=/root
mkdir -p \
  "$HOME/.bun/install/global" \
  "$HOME/.bun/bin" \
  /opt/informant/staff-review-agents \
  /opt/informant/staff-review-cwd
BUN_INSTALL_BIN="$HOME/.bun/bin" bun add --global --ignore-scripts \
  @earendil-works/pi-coding-agent@0.84.1 \
  pi-subagents@0.47.0
ln -sf "$HOME/.bun/bin/pi" /usr/local/bin/pi
ln -sf "$(command -v bun)" /usr/local/bin/node
ln -s "$HOME/.bun/install/global/node_modules" /opt/informant/node_modules
cat > /opt/informant/staff-review-agents/staff-review-find.md <<'FIND_AGENT'
---
name: staff-review-find
description: Find candidate issues for one assigned Staff Review slice
tools: read, bash, grep, find, ls
extensions: /opt/informant/staff-review-pi.ts
systemPromptMode: replace
inheritProjectContext: false
inheritSkills: false
defaultContext: fresh
acceptance: { level: "none", reason: "Read-only Staff Review analysis" }
---

Follow the task exactly. Read the named Staff Review skill and return only its JSON result. Never modify files, post comments, commit, or delegate further.
FIND_AGENT
cat > /opt/informant/staff-review-agents/staff-review-verify.md <<'VERIFY_AGENT'
---
name: staff-review-verify
description: Independently verify one batch of Staff Review findings
tools: read, bash, grep, find, ls
extensions: /opt/informant/staff-review-pi.ts
systemPromptMode: replace
inheritProjectContext: false
inheritSkills: false
defaultContext: fresh
acceptance: { level: "none", reason: "Read-only Staff Review verification" }
---

Follow the task exactly. Read the named Staff Review skill and return only its JSON result. Never modify files, post comments, commit, or delegate further.
VERIFY_AGENT
chmod 0555 /opt/informant/staff-review-cwd
chmod 0444 /opt/informant/staff-review-agents/*.md
cat > /opt/informant/staff-review-pi.ts <<'PI_EXTENSION'
import { spawn } from "node:child_process";
import { randomUUID } from "node:crypto";
import { realpathSync } from "node:fs";
import { basename, relative, resolve, sep } from "node:path";
import { StringEnum } from "@earendil-works/pi-ai";
import {
  DEFAULT_MAX_BYTES,
  createBashTool,
  createFindTool,
  createLsTool,
  createReadTool,
  isToolCallEventType,
  truncateHead,
  type BashOperations,
  type ExtensionAPI,
  type FindOperations,
  type LsOperations,
  type ReadOperations,
} from "@earendil-works/pi-coding-agent";
import {
  SUBAGENT_DELEGATION_CANCEL_EVENT,
  SUBAGENT_DELEGATION_REQUEST_EVENT,
  SUBAGENT_DELEGATION_RESPONSE_EVENT,
  type SubagentDelegationRequest,
  type SubagentDelegationResponse,
} from "pi-subagents/delegation";
import { Type } from "typebox";

const workspace = realpathSync(process.env.INFORMANT_REVIEW_ROOT ?? process.cwd());
const authRoot = realpathSync(process.env.PI_CODING_AGENT_DIR ?? "/mnt/informant-pi");
const fileOutputLimit = 10 * 1024 * 1024;

function isWithin(root: string, path: string): boolean {
  const fromRoot = relative(root, path);
  return fromRoot === "" || (fromRoot !== ".." && !fromRoot.startsWith(`..${sep}`));
}

function sandboxArguments(cwd: string): string[] {
  return [
    "--unshare-all",
    "--die-with-parent",
    "--new-session",
    "--uid",
    "0",
    "--gid",
    "0",
    "--ro-bind",
    "/",
    "/",
    "--dev",
    "/dev",
    "--proc",
    "/proc",
    "--bind",
    workspace,
    workspace,
    "--tmpfs",
    "/tmp",
    "--tmpfs",
    authRoot,
    "--chdir",
    cwd,
  ];
}

interface SandboxResult {
  stdout: Buffer;
  stderr: Buffer;
  exitCode: number | null;
  outputLimitReached: boolean;
}

function runSandboxed(
  executable: string,
  args: string[],
  cwd = workspace,
  signal?: AbortSignal,
  outputLimit = fileOutputLimit,
): Promise<SandboxResult> {
  return new Promise((done, reject) => {
    const child = spawn("bwrap", [...sandboxArguments(cwd), executable, ...args], {
      cwd,
      detached: true,
      env: process.env,
      stdio: ["ignore", "pipe", "pipe"],
    });
    const stdout: Buffer[] = [];
    const stderr: Buffer[] = [];
    let outputBytes = 0;
    let outputLimitReached = false;
    let settled = false;
    const stop = () => {
      if (!child.pid) return;
      try {
        process.kill(-child.pid, "SIGKILL");
      } catch {
        child.kill("SIGKILL");
      }
    };
    const append = (target: Buffer[], chunk: Buffer) => {
      if (outputLimitReached) return;
      const remaining = outputLimit - outputBytes;
      if (remaining <= 0) {
        outputLimitReached = true;
        stop();
        return;
      }
      const kept = chunk.subarray(0, remaining);
      target.push(kept);
      outputBytes += kept.length;
      if (kept.length < chunk.length || outputBytes >= outputLimit) {
        outputLimitReached = true;
        stop();
      }
    };
    const abort = () => stop();
    signal?.addEventListener("abort", abort, { once: true });
    child.stdout.on("data", (chunk: Buffer) => append(stdout, chunk));
    child.stderr.on("data", (chunk: Buffer) => append(stderr, chunk));
    child.on("error", (error) => {
      if (settled) return;
      settled = true;
      signal?.removeEventListener("abort", abort);
      reject(error);
    });
    child.on("close", (code) => {
      if (settled) return;
      settled = true;
      signal?.removeEventListener("abort", abort);
      if (signal?.aborted) reject(new Error("operation aborted"));
      else
        done({
          stdout: Buffer.concat(stdout),
          stderr: Buffer.concat(stderr),
          exitCode: code,
          outputLimitReached,
        });
    });
  });
}

function sandboxError(action: string, result: SandboxResult): Error {
  return new Error(
    `${action}: ${result.stderr.toString().trim() || `exit ${result.exitCode ?? "unknown"}`}`,
  );
}

async function sandboxTest(flag: string, path: string): Promise<boolean> {
  const result = await runSandboxed("/usr/bin/test", [flag, path]);
  if (result.exitCode === 0) return true;
  if (result.exitCode === 1) return false;
  throw sandboxError(`could not inspect ${path}`, result);
}

const readOperations: ReadOperations = {
  async access(path) {
    if (!(await sandboxTest("-r", path))) throw new Error(`Cannot read file: ${path}`);
  },
  async readFile(path) {
    const result = await runSandboxed("/bin/cat", ["--", path]);
    if (result.outputLimitReached) throw new Error(`File exceeds ${fileOutputLimit} bytes: ${path}`);
    if (result.exitCode !== 0) throw sandboxError(`could not read ${path}`, result);
    return result.stdout;
  },
};

const findOperations: FindOperations = {
  exists: (path) => sandboxTest("-e", path),
  async glob(pattern, cwd, { limit }) {
    const result = await runSandboxed(
      "/usr/bin/rg",
      [
        "--files",
        "--hidden",
        "--glob",
        "!node_modules/**",
        "--glob",
        "!.git/**",
        "--glob",
        pattern,
        "--",
        ".",
      ],
      cwd,
    );
    if (result.exitCode !== 0 && result.exitCode !== 1 && !result.outputLimitReached)
      throw sandboxError(`could not search ${cwd}`, result);
    return result.stdout
      .toString()
      .split("\\n")
      .filter(Boolean)
      .slice(0, limit);
  },
};

const lsOperations: LsOperations = {
  exists: (path) => sandboxTest("-e", path),
  async stat(path) {
    const directory = await sandboxTest("-d", path);
    return { isDirectory: () => directory };
  },
  async readdir(path) {
    const result = await runSandboxed(
      "/usr/bin/find",
      ["-H", path, "-mindepth", "1", "-maxdepth", "1", "-print0"],
    );
    if (result.exitCode !== 0) throw sandboxError(`could not list ${path}`, result);
    return result.stdout
      .toString()
      .split(String.fromCharCode(0))
      .filter(Boolean)
      .map((entry) => basename(entry));
  },
};

function sandboxedBashOperations(): BashOperations {
  return {
    async exec(command, cwd, { onData, signal, timeout }) {
      const args = [
        ...sandboxArguments(cwd),
        "/bin/bash",
        "-lc",
        `export HOME=/tmp/tool-home XDG_CONFIG_HOME=/tmp/tool-home/.config PI_CODING_AGENT_DIR=/tmp/pi-agent-unavailable; mkdir -p "$HOME" "$XDG_CONFIG_HOME"; ${command}`,
      ];
      return new Promise((done, reject) => {
        const child = spawn("bwrap", args, {
          cwd,
          detached: true,
          env: process.env,
          stdio: ["ignore", "pipe", "pipe"],
        });
        let timedOut = false;
        const stop = () => {
          if (!child.pid) return;
          try {
            process.kill(-child.pid, "SIGKILL");
          } catch {
            child.kill("SIGKILL");
          }
        };
        const timer = timeout
          ? setTimeout(() => {
              timedOut = true;
              stop();
            }, timeout * 1000)
          : undefined;
        const abort = () => stop();
        signal?.addEventListener("abort", abort, { once: true });
        child.stdout.on("data", onData);
        child.stderr.on("data", onData);
        child.on("error", reject);
        child.on("close", (code) => {
          if (timer) clearTimeout(timer);
          signal?.removeEventListener("abort", abort);
          if (signal?.aborted) reject(new Error("aborted"));
          else if (timedOut) reject(new Error(`timeout:${timeout}`));
          else done({ exitCode: code });
        });
      });
    },
  };
}

function runChild(
  pi: ExtensionAPI,
  task: string,
  role: "find" | "verify",
  signal?: AbortSignal,
): Promise<string> {
  const request: SubagentDelegationRequest = {
    requestId: randomUUID(),
    ownerRunId: `informant-staff-review-${process.pid}`,
    nodeId: randomUUID(),
    agent: `staff-review-${role}`,
    task,
    context: "fresh",
    cwd: "/opt/informant/staff-review-cwd",
    artifacts: false,
    result: { kind: "text" },
  };

  return new Promise((done, reject) => {
    let settled = false;
    let unsubscribe: (() => void) | undefined;
    const cleanup = () => {
      unsubscribe?.();
      signal?.removeEventListener("abort", abort);
    };
    const finish = (error?: Error, output?: string) => {
      if (settled) return;
      settled = true;
      cleanup();
      if (error) reject(error);
      else done(output ?? "[]");
    };
    const abort = () => {
      pi.events.emit(SUBAGENT_DELEGATION_CANCEL_EVENT, {
        requestId: request.requestId,
        ownerRunId: request.ownerRunId,
        nodeId: request.nodeId,
      });
      finish(new Error("sub-agent aborted"));
    };
    const subscription = pi.events.on(SUBAGENT_DELEGATION_RESPONSE_EVENT, (payload) => {
      const response = payload as SubagentDelegationResponse;
      if (
        response.requestId !== request.requestId ||
        response.ownerRunId !== request.ownerRunId ||
        response.nodeId !== request.nodeId
      )
        return;
      if (response.status !== "completed") {
        finish(new Error(response.error || `sub-agent ${response.status}`));
        return;
      }
      if (response.result?.kind !== "text") {
        finish(new Error("sub-agent returned no text result"));
        return;
      }
      try {
        const parsed = JSON.parse(response.result.text);
        if (!Array.isArray(parsed)) throw new Error("result is not an array");
        finish(undefined, JSON.stringify(parsed));
      } catch (error) {
        finish(
          new Error(
            `sub-agent returned invalid JSON: ${error instanceof Error ? error.message : String(error)}`,
          ),
        );
      }
    });
    if (typeof subscription === "function") unsubscribe = subscription;
    signal?.addEventListener("abort", abort, { once: true });
    if (signal?.aborted) abort();
    else pi.events.emit(SUBAGENT_DELEGATION_REQUEST_EVENT, request);
  });
}

export default function (pi: ExtensionAPI) {
  const bash = createBashTool(workspace, {
    exposeSessionEnvironment: false,
    operations: sandboxedBashOperations(),
  });
  pi.registerTool({ ...bash, label: "bash (isolated)" });
  pi.registerTool({
    ...createReadTool(workspace, { autoResizeImages: false, operations: readOperations }),
    label: "read (isolated)",
  });
  pi.registerTool({ ...createFindTool(workspace, { operations: findOperations }), label: "find (isolated)" });
  pi.registerTool({ ...createLsTool(workspace, { operations: lsOperations }), label: "ls (isolated)" });
  pi.registerTool({
    name: "grep",
    label: "grep (isolated)",
    description: `Search workspace file contents with ripgrep. Output is limited to 100 matches or ${DEFAULT_MAX_BYTES / 1024}KB.`,
    parameters: Type.Object({
      pattern: Type.String(),
      path: Type.Optional(Type.String()),
      glob: Type.Optional(Type.String()),
      ignoreCase: Type.Optional(Type.Boolean()),
      literal: Type.Optional(Type.Boolean()),
      context: Type.Optional(Type.Number()),
      limit: Type.Optional(Type.Number()),
    }),
    async execute(_id, params, signal) {
      const searchPath = resolve(workspace, (params.path ?? ".").replace(/^@/, ""));
      const effectiveLimit = Math.max(1, params.limit ?? 100);
      const context = params.context && params.context > 0 ? params.context : 0;
      const args = [
        "--json",
        "--line-number",
        "--color=never",
        "--hidden",
        "--glob",
        "!**/.git/**",
      ];
      if (params.ignoreCase) args.push("--ignore-case");
      if (params.literal) args.push("--fixed-strings");
      if (params.glob) args.push("--glob", params.glob);
      if (context) args.push("--context", String(context));
      args.push("--", params.pattern, searchPath);
      const result = await runSandboxed("/usr/bin/rg", args, workspace, signal);
      if (result.exitCode !== 0 && result.exitCode !== 1 && !result.outputLimitReached)
        throw sandboxError(`could not search ${searchPath}`, result);

      interface RipgrepEvent {
        type: string;
        data?: {
          path?: { text?: string };
          lines?: { text?: string };
          line_number?: number;
        };
      }
      const events: RipgrepEvent[] = [];
      for (const line of result.stdout.toString().split("\\n")) {
        if (!line) continue;
        try {
          events.push(JSON.parse(line) as RipgrepEvent);
        } catch {
          // An output-limit kill can leave one partial JSON record at the end.
        }
      }

      let matchCount = 0;
      const selectedMatches = new Map<string, Set<number>>();
      for (const event of events) {
        const file = event.data?.path?.text;
        const line = event.data?.line_number;
        if (event.type !== "match" || !file || typeof line !== "number") continue;
        matchCount += 1;
        if (matchCount > effectiveLimit) continue;
        const fileMatches = selectedMatches.get(file) ?? new Set<number>();
        fileMatches.add(line);
        selectedMatches.set(file, fileMatches);
      }

      const matchLimitReached = matchCount > effectiveLimit;
      const outputLines: string[] = [];
      let previous: { file: string; line: number } | undefined;
      for (const event of events) {
        if (event.type !== "match" && event.type !== "context") continue;
        const file = event.data?.path?.text;
        const line = event.data?.line_number;
        if (!file || typeof line !== "number") continue;
        const fileMatches = selectedMatches.get(file);
        if (!fileMatches) continue;
        const selectedMatch = event.type === "match" && fileMatches.has(line);
        const selectedContext =
          context > 0 && [...fileMatches].some((matchLine) => Math.abs(matchLine - line) <= context);
        if (!selectedMatch && !selectedContext) continue;
        if (previous && (previous.file !== file || previous.line + 1 < line)) outputLines.push("--");
        const separator = selectedMatch ? ":" : "-";
        const text = (event.data?.lines?.text ?? "").replace(/\\r?\\n$/, "");
        outputLines.push(`${file}${separator}${line}${separator}${text}`);
        previous = { file, line };
      }
      const rawOutput = outputLines.join("\\n").trim();
      if (!rawOutput)
        return { content: [{ type: "text", text: "No matches found" }], details: undefined };
      const truncation = truncateHead(rawOutput, { maxLines: Number.MAX_SAFE_INTEGER });
      let output = truncation.content;
      const notices = [];
      if (matchLimitReached) notices.push(`${effectiveLimit} matches limit reached`);
      if (truncation.truncated || result.outputLimitReached)
        notices.push(`${DEFAULT_MAX_BYTES / 1024}KB limit reached`);
      if (notices.length) output += `\\n\\n[${notices.join(". ")}]`;
      return {
        content: [{ type: "text", text: output }],
        details: {
          ...(matchLimitReached ? { matchLimitReached: effectiveLimit } : {}),
          ...(truncation.truncated ? { truncation } : {}),
        },
      };
    },
  });

  pi.on("tool_call", (event) => {
    if (
      isToolCallEventType("read", event) ||
      isToolCallEventType("grep", event) ||
      isToolCallEventType("find", event) ||
      isToolCallEventType("ls", event)
    ) {
      const path = "path" in event.input && event.input.path ? event.input.path : ".";
      if (!isWithin(workspace, resolve(workspace, path.replace(/^@/, "")))) {
        return { block: true, reason: "Staff Review tools may only access the workspace." };
      }
    }
  });

  pi.registerTool({
    name: "staff_agent",
    label: "Staff Review sub-agent",
    description: "Run one isolated Staff Review find or verify sub-agent and return its final output.",
    parameters: Type.Object({
      role: StringEnum(["find", "verify"] as const),
      task: Type.String(),
    }),
    async execute(_id, params, signal) {
      const output = await runChild(pi, params.task, params.role, signal);
      return { content: [{ type: "text", text: output }], details: { role: params.role } };
    },
  });
}
PI_EXTENSION
chmod 0444 /opt/informant/staff-review-pi.ts
curl -fsSL https://github.com/staffreview/staffreview/releases/download/v1.10.3/staff-linux-arm64 \
  -o /usr/local/bin/staff
chmod +x /usr/local/bin/staff
""" }
