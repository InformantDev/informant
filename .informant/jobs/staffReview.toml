name = "Staff Review"
# Workers advertise this label only after allowing the codex-auth mount.
runs_on = ["container", "staff-review"]
optional = true
command = """
set -eu
review_root="$PWD"
review_home="$(mktemp -d)"
pr_number="${INFORMANT_BRANCH#pull/}"
if [ "$pr_number" = "$INFORMANT_BRANCH" ]; then
  echo "staff review can only run for a pull request" >&2
  exit 1
fi
github_token="$GITHUB_TOKEN"
export GH_TOKEN="$github_token"
pr_json="$(curl -fsSL \
  -H "Accept: application/vnd.github+json" \
  -H "Authorization: Bearer $github_token" \
  -H "X-GitHub-Api-Version: 2022-11-28" \
  "https://api.github.com/repos/$INFORMANT_REPOSITORY/pulls/$pr_number")"
head_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha')"
base_sha="$(printf '%s' "$pr_json" | jq -r '.base.sha')"
if [ "$head_sha" != "$INFORMANT_SHA" ]; then
  echo "pull request head changed before staff review" >&2
  exit 1
fi

staff diff --base "$base_sha" --head working-tree --json >/dev/null
slug="$base_sha..WT"

unset GITHUB_TOKEN
unset GH_TOKEN
export HOME="$review_home"
export XDG_CONFIG_HOME="$review_home/.config"
cd "$review_root"
printf '$staff-review %s\n' "$slug" | codex exec \
  --ephemeral \
  --sandbox workspace-write \
  --ignore-user-config \
  --ignore-rules \
  -c 'web_search="disabled"' \
  -c sandbox_workspace_write.network_access=false \
  -c shell_environment_policy.ignore_default_excludes=false \
  -c "projects.\"$review_root\".trust_level=\"untrusted\"" \
  -

export GH_TOKEN="$github_token"
staff review post
"""
triggers = [{ event = "commit", pull_request = { state = "open", draft = false } }]
secrets = ["GITHUB_TOKEN"]
environment = { CODEX_HOME = "/mnt/informant-codex" }
mounts = [{ source = "codex-auth", target = "/mnt/informant-codex", write_back = true }]
cache = [{ paths = ["~/.bun/install/cache"], shared = true }]
container = { image = "docker.io/oven/bun:1", cpu = 2, memory_mb = 4096, prepare = """
set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get update
apt-get install -y --no-install-recommends ca-certificates curl git jq ripgrep
rm -rf /var/lib/apt/lists/*
export HOME=/root
mkdir -p "$HOME/.bun/install/global"
bun add --global @openai/codex@0.147.0-linux-arm64
ln -sf "$HOME/.bun/install/global/node_modules/@openai/codex/vendor/aarch64-unknown-linux-musl/bin/codex" /usr/local/bin/codex
curl -fsSL https://github.com/staffreview/staffreview/releases/download/v1.10.3/staff-linux-arm64 \
  -o /usr/local/bin/staff
chmod +x /usr/local/bin/staff
""" }
