name = "Staff Review"
# Workers advertise this label only after allowing the pi-auth mount.
runs_on = ["container", "staff-review"]
optional = true
command = """
set -eu
review_root="$PWD"
review_home="$(mktemp -d)"
pr_number="${INFORMANT_BRANCH#pull/}"
if [ "$pr_number" = "$INFORMANT_BRANCH" ]; then
  echo "staff review can only run for a pull request" >&2
  exit 1
fi
github_token="$GITHUB_TOKEN"
export GH_TOKEN="$github_token"
pr_json="$(curl -fsSL \
  -H "Accept: application/vnd.github+json" \
  -H "Authorization: Bearer $github_token" \
  -H "X-GitHub-Api-Version: 2022-11-28" \
  "https://api.github.com/repos/$INFORMANT_REPOSITORY/pulls/$pr_number")"
head_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha')"
base_sha="$(printf '%s' "$pr_json" | jq -r '.base.sha')"
if [ "$head_sha" != "$INFORMANT_SHA" ]; then
  echo "pull request head changed before staff review" >&2
  exit 1
fi

staff diff --base "$base_sha" --head working-tree --json >/dev/null
slug="$base_sha..WT"
staff files --slug "$slug" --json > /tmp/staff-review-files.json
review_agents="$(staff settings get reviewAgents)"

unset GITHUB_TOKEN
unset GH_TOKEN
unset CI
export HOME="$review_home"
export XDG_CONFIG_HOME="$review_home/.config"
export INFORMANT_REVIEW_ROOT="$review_root"
export INFORMANT_STAFF_FILES=/tmp/staff-review-files.json
cd "$review_root"
pi --print \
  --no-session \
  --no-approve \
  --no-extensions \
  --extension /opt/informant/extensions/subagents.ts \
  --no-skills \
  --no-prompt-templates \
  --no-context-files \
  --tools read,grep,find,ls,staff_files,subagent_create,subagent_read,subagent_terminate \
  --append-system-prompt 'Use subagent_create, subagent_read, and subagent_terminate for every find or verify worker. Launch independent agents in parallel, poll active agents about every 15 seconds, and call subagent_read with completed_output=true and the specific id before consuming a completed worker JSON array. Immediately terminate it with remove=true before replacing a finder with its verifier. Use at most eight live agents and batch larger review widths. Give every agent the complete skill-based worker prompt, cwd ".", and a fresh unique name. Never review inline, execute shell commands, post comments, or let a worker delegate further. Your final response must be only the deduplicated confirmed findings JSON array specified by the Staff Review workflow; return [] when none survive.' \
  --skill /opt/informant/skills/staff-review/SKILL.md \
  --skill /opt/informant/skills/staff-review-find/SKILL.md \
  --skill /opt/informant/skills/staff-review-verify/SKILL.md \
  "/skill:staff-review $slug $review_agents" > /tmp/staff-review-findings.json

jq -e 'type == "array"' /tmp/staff-review-findings.json >/dev/null
jq -c '.[]' /tmp/staff-review-findings.json | while IFS= read -r finding; do
  file="$(printf '%s' "$finding" | jq -er '.file | select(type == "string" and length > 0)')"
  line="$(printf '%s' "$finding" | jq -er '.line | select(type == "number" and floor == . and . > 0)')"
  end_line="$(printf '%s' "$finding" | jq -er 'if .endLine == null then "" else (.endLine | select(type == "number" and floor == . and . >= $line) | tostring) end' --argjson line "$line")"
  side="$(printf '%s' "$finding" | jq -er '.side | select(. == "new" or . == "old")')"
  priority="$(printf '%s' "$finding" | jq -er '.priority | select(. == "P1" or . == "P2" or . == "P3")')"
  body="$(printf '%s' "$finding" | jq -er '.body | select(type == "string" and length > 0)')"
  case "$file" in /*|../*|*/../*|*/..) echo "invalid finding path: $file" >&2; exit 1;; esac
  set -- comment add --slug "$slug" --file "$file" --line "$line" --side "$side" --author "Pi Staff Review" --priority "$priority"
  if [ -n "$end_line" ]; then set -- "$@" --end-line "$end_line"; fi
  printf '%s' "$body" | staff "$@" >/dev/null
done

export GH_TOKEN="$github_token"
staff review post --slug "$slug" --pr "$pr_number" --github-repo "$INFORMANT_REPOSITORY" --commit "$head_sha"
"""
triggers = [{ event = "commit", pull_request = { state = "open", draft = false } }]
secrets = ["GITHUB_TOKEN"]
environment = { PI_CODING_AGENT_DIR = "/mnt/informant-pi", PI_OFFLINE = "1" }
mounts = [{ source = "pi-auth", target = "/mnt/informant-pi", write_back = true }]
cache = [{ paths = ["~/.bun/install/cache"], shared = true }]
container = { image = "docker.io/oven/bun:1", cpu = 2, memory_mb = 4096, trustedPrepareInputs = true, prepareInputs = ["informant-subagents.ts", "informant-footer-events.ts", ".agents/skills/staff-review/**", ".agents/skills/staff-review-find/**", ".agents/skills/staff-review-verify/**"], prepare = """
set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get update
apt-get install -y --no-install-recommends ca-certificates curl git jq ripgrep
rm -rf /var/lib/apt/lists/*
export HOME=/root
mkdir -p "$HOME/.bun/install/global" "$HOME/.bun/bin" /opt/informant/extensions /opt/informant/skills
cp /workspace/informant-subagents.ts /opt/informant/extensions/subagents.ts
cp /workspace/informant-footer-events.ts /opt/informant/extensions/informant-footer-events.ts
cp -R /workspace/.agents/skills/staff-review /opt/informant/skills/
cp -R /workspace/.agents/skills/staff-review-find /opt/informant/skills/
cp -R /workspace/.agents/skills/staff-review-verify /opt/informant/skills/
chmod -R a-w /opt/informant/extensions /opt/informant/skills
rm -rf /workspace/* /workspace/.[!.]* /workspace/..?*
BUN_INSTALL_BIN="$HOME/.bun/bin" bun add --global --ignore-scripts \
  @earendil-works/pi-coding-agent@0.84.1
ln -sf "$HOME/.bun/bin/pi" /usr/local/bin/pi
ln -sf "$(command -v bun)" /usr/local/bin/node
curl -fsSL https://github.com/staffreview/staffreview/releases/download/v1.10.3/staff-linux-arm64 \
  -o /usr/local/bin/staff
chmod +x /usr/local/bin/staff
""" }
