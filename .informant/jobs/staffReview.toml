name = "Staff Review"
runs_on = ["container"]
optional = true
command = """
set -eu
review_root="$PWD"
review_home="$(mktemp -d)"
printf '{}\n' > "$review_home/settings.json"
pr_number="${INFORMANT_BRANCH#pull/}"
if [ "$pr_number" = "$INFORMANT_BRANCH" ]; then
  echo "staff review can only run for a pull request" >&2
  exit 1
fi
github_token="$GITHUB_TOKEN"
export GH_TOKEN="$github_token"
pr_json="$(curl -fsSL \
  -H "Accept: application/vnd.github+json" \
  -H "Authorization: Bearer $github_token" \
  -H "X-GitHub-Api-Version: 2022-11-28" \
  "https://api.github.com/repos/$INFORMANT_REPOSITORY/pulls/$pr_number")"
head_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha')"
base_sha="$(printf '%s' "$pr_json" | jq -r '.base.sha')"
if [ "$head_sha" != "$INFORMANT_SHA" ]; then
  echo "pull request head changed before staff review" >&2
  exit 1
fi

staff diff --base "$base_sha" --head working-tree --json >/dev/null
slug="$base_sha..WT"

unset GITHUB_TOKEN
unset GH_TOKEN
export HOME="$review_home"
export XDG_CONFIG_HOME="$review_home/.config"
cd "$review_root"
amp --settings-file "$review_home/settings.json" --mcp-config '{}' --no-ide --no-notifications \
  --visibility unlisted --mode medium --execute "/staff-review $slug"

export GH_TOKEN="$github_token"
staff review post
"""
triggers = [{ event = "commit", pull_request = { state = "open", draft = false } }]
secrets = ["AMP_API_KEY", "GITHUB_TOKEN"]
cache = [{ paths = ["~/.bun/install/cache"], shared = true }]
container = { image = "docker.io/oven/bun:1", cpu = 2, memory_mb = 4096, prepare = """
set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get update
apt-get install -y --no-install-recommends ca-certificates curl git jq ripgrep
rm -rf /var/lib/apt/lists/*
export HOME=/root
mkdir -p "$HOME/.bun/install/global"
case "$(uname -m)" in
  aarch64|arm64)
    amp_package="@ampcode/cli-linux-arm64"
    staff_asset="staff-linux-arm64"
    ;;
  x86_64)
    amp_package="@ampcode/cli-linux-x64"
    staff_asset="staff-linux-x64"
    ;;
  *)
    echo "unsupported architecture for Staff Review: $(uname -m)" >&2
    exit 1
    ;;
esac
bun add --global "$amp_package@0.0.1784917055-ge644b2"
ln -sf "$HOME/.bun/install/global/node_modules/$amp_package/amp" /usr/local/bin/amp
curl -fsSL "https://github.com/staffreview/staffreview/releases/download/v1.10.2/$staff_asset" \
  -o /usr/local/bin/staff
chmod +x /usr/local/bin/staff
""" }
