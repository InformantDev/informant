name = "Staff Review"
# Workers advertise this label only after allowing the pi-auth mount.
runs_on = ["container", "staff-review"]
optional = true
command = """
set -eu
review_root="$PWD"
review_home="$(mktemp -d)"
pr_number="${INFORMANT_BRANCH#pull/}"
if [ "$pr_number" = "$INFORMANT_BRANCH" ]; then
  echo "staff review can only run for a pull request" >&2
  exit 1
fi
github_token="$GITHUB_TOKEN"
export GH_TOKEN="$github_token"
pr_json="$(curl -fsSL \
  -H "Accept: application/vnd.github+json" \
  -H "Authorization: Bearer $github_token" \
  -H "X-GitHub-Api-Version: 2022-11-28" \
  "https://api.github.com/repos/$INFORMANT_REPOSITORY/pulls/$pr_number")"
head_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha')"
base_sha="$(printf '%s' "$pr_json" | jq -r '.base.sha')"
if [ "$head_sha" != "$INFORMANT_SHA" ]; then
  echo "pull request head changed before staff review" >&2
  exit 1
fi

staff diff --base "$base_sha" --head working-tree --json >/dev/null
slug="$base_sha..WT"

unset GITHUB_TOKEN
unset GH_TOKEN
export HOME="$review_home"
export XDG_CONFIG_HOME="$review_home/.config"
cd "$review_root"
pi --print \
  --no-session \
  --approve \
  --no-extensions \
  --extension /opt/informant/staff-review-pi.ts \
  --no-prompt-templates \
  --no-context-files \
  --tools read,bash,grep,find,ls,staff_agent \
  --append-system-prompt 'Use the staff_agent tool whenever the Staff Review skill asks you to spawn a find or verify sub-agent. Make one tool call per agent, issue independent calls together for parallel execution, pass the complete worker prompt as task, and use role=find or role=verify as appropriate. The tool waits for the child and returns its final output, so no separate stop call is needed. Never launch Pi through bash.' \
  "/skill:staff-review $slug"

export GH_TOKEN="$github_token"
staff review post
"""
triggers = [{ event = "commit", pull_request = { state = "open", draft = false } }]
secrets = ["GITHUB_TOKEN"]
environment = { PI_CODING_AGENT_DIR = "/mnt/informant-pi", PI_OFFLINE = "1" }
mounts = [{ source = "pi-auth", target = "/mnt/informant-pi", write_back = true }]
cache = [{ paths = ["~/.bun/install/cache"], shared = true }]
container = { image = "docker.io/oven/bun:1", cpu = 2, memory_mb = 4096, prepare = """
set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get update
apt-get install -y --no-install-recommends bubblewrap ca-certificates curl git jq ripgrep
rm -rf /var/lib/apt/lists/*
export HOME=/root
mkdir -p "$HOME/.bun/install/global" "$HOME/.bun/bin" /opt/informant
BUN_INSTALL_BIN="$HOME/.bun/bin" bun add --global --ignore-scripts \
  @earendil-works/pi-coding-agent@0.84.1
ln -sf "$HOME/.bun/bin/pi" /usr/local/bin/pi
ln -sf "$(command -v bun)" /usr/local/bin/node
cat > /opt/informant/staff-review-pi.ts <<'PI_EXTENSION'
import { spawn } from "node:child_process";
import { realpathSync } from "node:fs";
import { relative, resolve, sep } from "node:path";
import { StringEnum } from "@earendil-works/pi-ai";
import {
  DEFAULT_MAX_BYTES,
  createBashTool,
  createFindTool,
  createLsTool,
  createReadTool,
  isToolCallEventType,
  truncateHead,
  type BashOperations,
  type ExtensionAPI,
  type FindOperations,
  type LsOperations,
  type ReadOperations,
} from "@earendil-works/pi-coding-agent";
import { Type } from "typebox";

const workspace = realpathSync(process.cwd());
const authRoot = realpathSync(process.env.PI_CODING_AGENT_DIR ?? "/mnt/informant-pi");
const extensionPath = "/opt/informant/staff-review-pi.ts";
const childOutputLimit = 1024 * 1024;
const fileOutputLimit = 10 * 1024 * 1024;

function isWithin(root: string, path: string): boolean {
  const fromRoot = relative(root, path);
  return fromRoot === "" || (fromRoot !== ".." && !fromRoot.startsWith(`..${sep}`));
}

function sandboxArguments(cwd: string): string[] {
  return [
    "--unshare-all",
    "--die-with-parent",
    "--new-session",
    "--uid",
    "0",
    "--gid",
    "0",
    "--ro-bind",
    "/",
    "/",
    "--dev",
    "/dev",
    "--proc",
    "/proc",
    "--bind",
    workspace,
    workspace,
    "--tmpfs",
    "/tmp",
    "--tmpfs",
    authRoot,
    "--chdir",
    cwd,
  ];
}

interface SandboxResult {
  stdout: Buffer;
  stderr: Buffer;
  exitCode: number | null;
  outputLimitReached: boolean;
}

function runSandboxed(
  executable: string,
  args: string[],
  cwd = workspace,
  signal?: AbortSignal,
  outputLimit = fileOutputLimit,
): Promise<SandboxResult> {
  return new Promise((done, reject) => {
    const child = spawn("bwrap", [...sandboxArguments(cwd), executable, ...args], {
      cwd,
      detached: true,
      env: process.env,
      stdio: ["ignore", "pipe", "pipe"],
    });
    const stdout: Buffer[] = [];
    const stderr: Buffer[] = [];
    let outputBytes = 0;
    let outputLimitReached = false;
    let settled = false;
    const stop = () => {
      if (!child.pid) return;
      try {
        process.kill(-child.pid, "SIGKILL");
      } catch {
        child.kill("SIGKILL");
      }
    };
    const append = (target: Buffer[], chunk: Buffer) => {
      if (outputLimitReached) return;
      const remaining = outputLimit - outputBytes;
      if (remaining <= 0) {
        outputLimitReached = true;
        stop();
        return;
      }
      const kept = chunk.subarray(0, remaining);
      target.push(kept);
      outputBytes += kept.length;
      if (kept.length < chunk.length || outputBytes >= outputLimit) {
        outputLimitReached = true;
        stop();
      }
    };
    const abort = () => stop();
    signal?.addEventListener("abort", abort, { once: true });
    child.stdout.on("data", (chunk: Buffer) => append(stdout, chunk));
    child.stderr.on("data", (chunk: Buffer) => append(stderr, chunk));
    child.on("error", (error) => {
      if (settled) return;
      settled = true;
      signal?.removeEventListener("abort", abort);
      reject(error);
    });
    child.on("close", (code) => {
      if (settled) return;
      settled = true;
      signal?.removeEventListener("abort", abort);
      if (signal?.aborted) reject(new Error("operation aborted"));
      else
        done({
          stdout: Buffer.concat(stdout),
          stderr: Buffer.concat(stderr),
          exitCode: code,
          outputLimitReached,
        });
    });
  });
}

function sandboxError(action: string, result: SandboxResult): Error {
  return new Error(
    `${action}: ${result.stderr.toString().trim() || `exit ${result.exitCode ?? "unknown"}`}`,
  );
}

async function sandboxTest(flag: string, path: string): Promise<boolean> {
  const result = await runSandboxed("/usr/bin/test", [flag, path]);
  if (result.exitCode === 0) return true;
  if (result.exitCode === 1) return false;
  throw sandboxError(`could not inspect ${path}`, result);
}

const readOperations: ReadOperations = {
  async access(path) {
    if (!(await sandboxTest("-r", path))) throw new Error(`Cannot read file: ${path}`);
  },
  async readFile(path) {
    const result = await runSandboxed("/bin/cat", ["--", path]);
    if (result.outputLimitReached) throw new Error(`File exceeds ${fileOutputLimit} bytes: ${path}`);
    if (result.exitCode !== 0) throw sandboxError(`could not read ${path}`, result);
    return result.stdout;
  },
};

const findOperations: FindOperations = {
  exists: (path) => sandboxTest("-e", path),
  async glob(pattern, cwd, { limit }) {
    const result = await runSandboxed(
      "/usr/bin/rg",
      [
        "--files",
        "--hidden",
        "--glob",
        "!node_modules/**",
        "--glob",
        "!.git/**",
        "--glob",
        pattern,
        "--",
        ".",
      ],
      cwd,
    );
    if (result.exitCode !== 0 && result.exitCode !== 1 && !result.outputLimitReached)
      throw sandboxError(`could not search ${cwd}`, result);
    return result.stdout
      .toString()
      .split("\\n")
      .filter(Boolean)
      .slice(0, limit);
  },
};

const lsOperations: LsOperations = {
  exists: (path) => sandboxTest("-e", path),
  async stat(path) {
    const directory = await sandboxTest("-d", path);
    return { isDirectory: () => directory };
  },
  async readdir(path) {
    const result = await runSandboxed(
      "/usr/bin/find",
      ["-H", path, "-mindepth", "1", "-maxdepth", "1", "-print0"],
    );
    if (result.exitCode !== 0) throw sandboxError(`could not list ${path}`, result);
    return result.stdout.toString().split(String.fromCharCode(0)).filter(Boolean);
  },
};

function sandboxedBashOperations(): BashOperations {
  return {
    async exec(command, cwd, { onData, signal, timeout }) {
      const args = [
        ...sandboxArguments(cwd),
        "/bin/bash",
        "-lc",
        `export HOME=/tmp/tool-home XDG_CONFIG_HOME=/tmp/tool-home/.config PI_CODING_AGENT_DIR=/tmp/pi-agent-unavailable; mkdir -p "$HOME" "$XDG_CONFIG_HOME"; ${command}`,
      ];
      return new Promise((done, reject) => {
        const child = spawn("bwrap", args, {
          cwd,
          detached: true,
          env: process.env,
          stdio: ["ignore", "pipe", "pipe"],
        });
        let timedOut = false;
        const stop = () => {
          if (!child.pid) return;
          try {
            process.kill(-child.pid, "SIGKILL");
          } catch {
            child.kill("SIGKILL");
          }
        };
        const timer = timeout
          ? setTimeout(() => {
              timedOut = true;
              stop();
            }, timeout * 1000)
          : undefined;
        const abort = () => stop();
        signal?.addEventListener("abort", abort, { once: true });
        child.stdout.on("data", onData);
        child.stderr.on("data", onData);
        child.on("error", reject);
        child.on("close", (code) => {
          if (timer) clearTimeout(timer);
          signal?.removeEventListener("abort", abort);
          if (signal?.aborted) reject(new Error("aborted"));
          else if (timedOut) reject(new Error(`timeout:${timeout}`));
          else done({ exitCode: code });
        });
      });
    },
  };
}

function runChild(task: string, role: "find" | "verify", signal?: AbortSignal): Promise<string> {
  const args = [
    "--print",
    "--no-session",
    "--approve",
    "--no-extensions",
    "--extension",
    extensionPath,
    "--no-prompt-templates",
    "--no-context-files",
    "--tools",
    "read,bash,grep,find,ls",
    task,
  ];
  return new Promise((done, reject) => {
    const child = spawn("/usr/local/bin/pi", args, {
      cwd: workspace,
      detached: true,
      env: { ...process.env, PI_STAFF_REVIEW_CHILD: role },
      stdio: ["ignore", "pipe", "pipe"],
    });
    let stdout = "";
    let stderr = "";
    const append = (current: string, chunk: Buffer) =>
      (current + chunk.toString()).slice(-childOutputLimit);
    const stop = () => {
      if (!child.pid) return;
      try {
        process.kill(-child.pid, "SIGKILL");
      } catch {
        child.kill("SIGKILL");
      }
    };
    const abort = () => stop();
    signal?.addEventListener("abort", abort, { once: true });
    child.stdout.on("data", (chunk) => {
      stdout = append(stdout, chunk);
    });
    child.stderr.on("data", (chunk) => {
      stderr = append(stderr, chunk);
    });
    child.on("error", reject);
    child.on("close", (code) => {
      signal?.removeEventListener("abort", abort);
      if (signal?.aborted) reject(new Error("sub-agent aborted"));
      else if (code !== 0) reject(new Error(stderr.trim() || `sub-agent exited ${code}`));
      else done(stdout.trim() || "[]");
    });
  });
}

export default function (pi: ExtensionAPI) {
  const bash = createBashTool(workspace, {
    exposeSessionEnvironment: false,
    operations: sandboxedBashOperations(),
  });
  pi.registerTool({ ...bash, label: "bash (isolated)" });
  pi.registerTool({
    ...createReadTool(workspace, { autoResizeImages: false, operations: readOperations }),
    label: "read (isolated)",
  });
  pi.registerTool({ ...createFindTool(workspace, { operations: findOperations }), label: "find (isolated)" });
  pi.registerTool({ ...createLsTool(workspace, { operations: lsOperations }), label: "ls (isolated)" });
  pi.registerTool({
    name: "grep",
    label: "grep (isolated)",
    description: `Search workspace file contents with ripgrep. Output is limited to 100 matches or ${DEFAULT_MAX_BYTES / 1024}KB.`,
    parameters: Type.Object({
      pattern: Type.String(),
      path: Type.Optional(Type.String()),
      glob: Type.Optional(Type.String()),
      ignoreCase: Type.Optional(Type.Boolean()),
      literal: Type.Optional(Type.Boolean()),
      context: Type.Optional(Type.Number()),
      limit: Type.Optional(Type.Number()),
    }),
    async execute(_id, params, signal) {
      const searchPath = resolve(workspace, (params.path ?? ".").replace(/^@/, ""));
      const effectiveLimit = Math.max(1, params.limit ?? 100);
      const args = ["--line-number", "--color=never", "--hidden"];
      if (params.ignoreCase) args.push("--ignore-case");
      if (params.literal) args.push("--fixed-strings");
      if (params.glob) args.push("--glob", params.glob);
      if (params.context && params.context > 0) args.push("--context", String(params.context));
      args.push("--", params.pattern, searchPath);
      const result = await runSandboxed("/usr/bin/rg", args, workspace, signal);
      if (result.exitCode !== 0 && result.exitCode !== 1 && !result.outputLimitReached)
        throw sandboxError(`could not search ${searchPath}`, result);
      const matches = result.stdout.toString().split("\\n");
      const matchLimitReached = matches.length > effectiveLimit;
      const rawOutput = matches.slice(0, effectiveLimit).join("\\n").trim();
      if (!rawOutput)
        return { content: [{ type: "text", text: "No matches found" }], details: undefined };
      const truncation = truncateHead(rawOutput, { maxLines: Number.MAX_SAFE_INTEGER });
      let output = truncation.content;
      const notices = [];
      if (matchLimitReached) notices.push(`${effectiveLimit} matches limit reached`);
      if (truncation.truncated || result.outputLimitReached)
        notices.push(`${DEFAULT_MAX_BYTES / 1024}KB limit reached`);
      if (notices.length) output += `\\n\\n[${notices.join(". ")}]`;
      return {
        content: [{ type: "text", text: output }],
        details: {
          ...(matchLimitReached ? { matchLimitReached: effectiveLimit } : {}),
          ...(truncation.truncated ? { truncation } : {}),
        },
      };
    },
  });

  pi.on("tool_call", (event) => {
    if (
      isToolCallEventType("read", event) ||
      isToolCallEventType("grep", event) ||
      isToolCallEventType("find", event) ||
      isToolCallEventType("ls", event)
    ) {
      const path = "path" in event.input && event.input.path ? event.input.path : ".";
      if (!isWithin(workspace, resolve(workspace, path.replace(/^@/, "")))) {
        return { block: true, reason: "Staff Review tools may only access the workspace." };
      }
    }
  });

  if (process.env.PI_STAFF_REVIEW_CHILD) return;
  pi.registerTool({
    name: "staff_agent",
    label: "Staff Review sub-agent",
    description: "Run one isolated Staff Review find or verify sub-agent and return its final output.",
    parameters: Type.Object({
      role: StringEnum(["find", "verify"] as const),
      task: Type.String(),
    }),
    async execute(_id, params, signal) {
      const output = await runChild(params.task, params.role, signal);
      return { content: [{ type: "text", text: output }], details: { role: params.role } };
    },
  });
}
PI_EXTENSION
chmod 0444 /opt/informant/staff-review-pi.ts
curl -fsSL https://github.com/staffreview/staffreview/releases/download/v1.10.3/staff-linux-arm64 \
  -o /usr/local/bin/staff
chmod +x /usr/local/bin/staff
""" }
