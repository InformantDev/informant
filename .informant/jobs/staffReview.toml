name = "Staff Review"
# Workers advertise this label only after allowing the pi-auth mount.
runs_on = ["container", "staff-review"]
optional = true
command = """
set -eu
review_root="$PWD"
review_home="$(mktemp -d)"
pr_number="${INFORMANT_BRANCH#pull/}"
if [ "$pr_number" = "$INFORMANT_BRANCH" ]; then
  echo "staff review can only run for a pull request" >&2
  exit 1
fi
github_token="$GITHUB_TOKEN"
export GH_TOKEN="$github_token"
pr_json="$(curl -fsSL \
  -H "Accept: application/vnd.github+json" \
  -H "Authorization: Bearer $github_token" \
  -H "X-GitHub-Api-Version: 2022-11-28" \
  "https://api.github.com/repos/$INFORMANT_REPOSITORY/pulls/$pr_number")"
head_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha')"
base_sha="$(printf '%s' "$pr_json" | jq -r '.base.sha')"
if [ "$head_sha" != "$INFORMANT_SHA" ]; then
  echo "pull request head changed before staff review" >&2
  exit 1
fi

staff diff --base "$base_sha" --head working-tree --json >/dev/null
slug="$base_sha..WT"
staff files --slug "$slug" --json > /tmp/staff-review-files.json

unset GITHUB_TOKEN
unset GH_TOKEN
unset CI
export HOME="$review_home"
export XDG_CONFIG_HOME="$review_home/.config"
cd "$review_root"
pi --print \
  --no-session \
  --approve \
  --no-extensions \
  --extension /opt/informant/extensions/subagents.ts \
  --no-prompt-templates \
  --no-context-files \
  --tools read,grep,find,ls,subagent_create,subagent_read,subagent_terminate \
  --append-system-prompt 'Use subagent_create, subagent_read, and subagent_terminate for every find or verify sub-agent requested by the Staff Review skill. Launch independent agents with parallel subagent_create calls, poll active agents with subagent_read about every 15 seconds, consume only the JSON array in each completed agent output, and immediately call subagent_terminate with remove=true before replacing a find agent with its verifier. Use at most eight live agents and batch larger review widths. Give every agent the complete skill-based worker prompt, cwd ".", and a fresh unique name. Never review inline, execute shell commands, steer completed workers, or let a worker delegate further. Use the staff CLI only as described by the Staff Review skills, through the dedicated job steps outside Pi.' \
  "/skill:staff-review $slug"

export GH_TOKEN="$github_token"
staff review post
"""
triggers = [{ event = "commit", pull_request = { state = "open", draft = false } }]
secrets = ["GITHUB_TOKEN"]
environment = { PI_CODING_AGENT_DIR = "/mnt/informant-pi", PI_OFFLINE = "1" }
mounts = [{ source = "pi-auth", target = "/mnt/informant-pi", write_back = true }]
cache = [{ paths = ["~/.bun/install/cache"], shared = true }]
container = { image = "docker.io/oven/bun:1", cpu = 2, memory_mb = 4096, network = false, prepareInputs = ["informant-subagents.ts", "informant-footer-events.ts"], prepare = """
set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get update
apt-get install -y --no-install-recommends ca-certificates curl git jq ripgrep
rm -rf /var/lib/apt/lists/*
export HOME=/root
mkdir -p "$HOME/.bun/install/global" "$HOME/.bun/bin" /opt/informant/extensions
cp /workspace/informant-subagents.ts /opt/informant/extensions/subagents.ts
cp /workspace/informant-footer-events.ts /opt/informant/extensions/footer-events.ts
chmod 0444 /opt/informant/extensions/*.ts
rm -rf /workspace/* /workspace/.[!.]* /workspace/..?*
BUN_INSTALL_BIN="$HOME/.bun/bin" bun add --global --ignore-scripts \
  @earendil-works/pi-coding-agent@0.84.1
ln -sf "$HOME/.bun/bin/pi" /usr/local/bin/pi
ln -sf "$(command -v bun)" /usr/local/bin/node
curl -fsSL https://github.com/staffreview/staffreview/releases/download/v1.10.3/staff-linux-arm64 \
  -o /usr/local/bin/staff
chmod +x /usr/local/bin/staff
""" }
