name = "build"
command = """
set -eu
bun install --frozen-lockfile --backend=copyfile
bun run build
"""
environment = { CI = "true", NEXT_TELEMETRY_DISABLED = "1" }
needs = ["test", "lint", "typecheck"]
container.image = "oven/bun:1"
container.cpu = 2
container.memory_mb = 4096
container.prepareInputs = ["bun.lock", "bunfig.toml", "package.json", "apps/*/package.json"]
container.prepare = "bun install --frozen-lockfile --ignore-scripts"
