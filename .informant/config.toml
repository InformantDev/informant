version = 1
timeout_minutes = 30
environment = { CI = "true", TURBO_CACHE_DIR = "/home/root/.cache/turborepo", TURBO_CACHE_MAX_AGE = "14d", TURBO_CACHE_MAX_SIZE = "10GB" }
cache = [
  { paths = ["~/.bun/install/cache"], shared = true },
  { paths = ["~/.cache/turborepo"], shared = true },
]
triggers = [
  { event = "commit", branch = { names = ["main"] } },
  { event = "commit", pull_request = { state = "open", draft = false } },
]

[vm]
image = "ghcr.io/cirruslabs/macos-tahoe-base:latest"
user = "admin"
password = "admin"
cpu = 4
memory_mb = 8192
prepare = """
set -euo pipefail
curl -fsSL https://bun.sh/install | bash
sudo mkdir -p /usr/local/bin
sudo ln -sf "$HOME/.bun/bin/bun" /usr/local/bin/bun
brew install gh
"""
