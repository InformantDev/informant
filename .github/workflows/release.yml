name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-latest
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
            smoke_test: true
          - os: ubuntu-24.04-arm
            target: linux-arm64
            smoke_test: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run --filter @informant/cli build:binary:${{ matrix.target }}
      - name: Smoke test native binary
        if: matrix.smoke_test
        run: apps/informant/dist/informant-${{ matrix.target }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: informant-${{ matrix.target }}
          path: apps/informant/dist/informant-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Compute checksums
        run: |
          cd artifacts
          for file in informant-*; do
            sha256sum "$file" | tee -a SHA256SUMS
          done
      - name: Render Homebrew formula
        run: ./scripts/render-homebrew-formula.sh "$GITHUB_REF_NAME" artifacts/SHA256SUMS artifacts/informant.rb
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/informant-*
            artifacts/informant.rb
            artifacts/SHA256SUMS
          generate_release_notes: true
